name: "OrionFlow CodeQL"

on:
  push:
    paths:
      - '**/*.orion'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract file name from commit message
        id: extract_file
        run: |
          FILENAME="${{ github.event.head_commit.message }}"
          echo "script=$FILENAME" >> $GITHUB_OUTPUT

          if [ -f "$FILENAME" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Error: File $FILENAME mentioned in the commit does not exist"
          fi

      - name: Skip if no valid Orion script
        if: steps.extract_file.outputs.run == 'false'
        run: echo "No valid .orion file found — skipping."

      - name: Clean old generated queries
        if: steps.extract_file.outputs.run == 'true'
        run: rm -rf .github/codeql/queries/*

      - name: Generate CodeQL queries
        if: steps.extract_file.outputs.run == 'true'
        run: |
          echo "Generating queries for ${{ steps.extract_file.outputs.script }}"
          java -jar .github/codeql/generator-js.jar \
               -i "${{ steps.extract_file.outputs.script }}" \
               -o .github/codeql/queries \
               -a ALL

      - name: Initialize CodeQL
        if: steps.extract_file.outputs.run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/orionflow-config.yml

      - name: Perform CodeQL Analysis
        if: steps.extract_file.outputs.run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-orionflow"
          output: results.sarif
      - name: Preserve SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: orionflow-sarif-${{ github.run_id }}
            path: results.sarif/
